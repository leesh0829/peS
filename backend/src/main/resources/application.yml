spring:
  application:
    name: pes-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pes}
    username: ${DB_USERNAME:pes}
    password: ${DB_PASSWORD:pes_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
